[workspace]
members = [
    "leaf",
    "leaf-cli",
    "leaf-oray",
    "leaf-ffi",
    "leaf-plugins/shadowsocks",
]
default-members = ["leaf-cli"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

[profile.oray]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
